# Edit Blueprint — beat-first plan for one production.
# Reference: video-workflow/templates/edit-blueprint-reference.md
# Runtime copy: video-workflow/production/edit-blueprint.yaml

version: 1

production_id: "" # Must match brief production.id

style:
  skill: "" # L2 skill ID

author_intent:
  global: null # Optional string — whole-piece intent from Owner
  local: [] # Optional: { beat_id, intent }

review_before_edit: false # true = pause for Owner before Edit stage

beats: []
# Each beat example:
# - beat_id: B01
#   narrative_function: CONTRAST # vocabulary from editing-craft/directing-story.md
#   source_content_range: "" # narration segment, script section, or time hint
#   author_intent: null # optional local override
#   audience_effect: "" # surprise | clarity | empathy | etc.
#   visual_intent: ""
#   attention_target: ""
#   preferred_shot_functions:
#     - ESTABLISH
#     - EVIDENCE
#     - REVEAL
#   pacing: medium-fast # slow | medium | medium-fast | fast
#   sound_music_intent: narration dominant
#   subtitle_graphics_intent: standard caption
#   subtitle_typography_intent: # optional — semantic only, no Runtime params
#     caption_mode: standard_caption # standard_caption | caption_free | title_or_section
#     emphasis_targets:
#       - text: "40%"
#         semantic_role: key_number
#         intensity: strong
#     notes: ""
#   color_effect_intent: natural
#   asset_selection_guidance: ""
#   shot_plan: null # optional list — expand only when beat requires detail
#   A beat or narration sentence change does not by itself start a new clip.
#   capability_requirements:
#     required:
#       - visual.reframe.static
#     preferred:
#       - visual.motion.push_in
#     optional:
#       - audio.music.duck
#     fallback:
#       visual.motion.push_in:
#         - visual.reframe.static

capability_requirements: {}
# Global defaults when not set per-beat. Same shape as beat-level block above.

assembly_plan:
  shots: []
# Traceable execution handoff for pacing + reframe QA (Step 4B):
# - shot_id: B07-S12
#   beat_id: B07
#   source_asset: market.mp4
#   source_range: { in_sec: 0.0, out_sec: 4.5 }
#   timeline_duration_sec: 4.5
#   reframe:
#     required: true
#     applied: false
#     scale: null
#     position: { x: 0, y: 0 }
#   pacing_exempt: false
#   editorial_reason: null

notes: ""
