# Informational-short Pacing V1 — beat-first editorial rhythm contract (Step 4B)
# Heuristic thresholds — not universal editing law.

schema_version: 1
profile_id: informational_short_pacing_v1

authority:
  primary: beat
  shot_expansion: on_demand

rules:
  - beat_is_primary_rhythm_authority
  - narration_or_beat_change_is_not_a_mandatory_picture_cut
  - continuous_shot_preservation
  - no_single_visual_across_unrelated_semantic_beats_without_reason
  - on_beat_change_prefer:
      - continue_current_shot_when_source_time_abuts
      - new_source_only_when_picture_intent_changes
  - long_take_is_not_repaired_by_asset_swap
  - long_take_hold_does_not_block_when_nothing_else_fails
  - timeline_positions_must_abut_before_merge
  - resolve_clip_info_frames_must_match_before_and_after_merge
  - replan_continuous_source_range_is_a_suggestion_not_an_executed_replan
  - do_not_fill_source_gaps_when_joining_trims
  - do_not_auto_escalate_to:
      - visual.motion.push_in
      - visual.motion.pan
      - resolvefx
      - fusion_motion
      - decorative_transitions

thresholds:
  warning_duration_sec: 6.0
  repair_review_duration_sec: 10.0
  micro_fragment:
    max_frames: 2
    max_sec_fallback: 0.084
  notes: "V1 heuristic only — editorial_reason / intentional_flash may exempt."

repair_priority:
  - clip.merge_continuous_source
  - replan_continuous_source_range
  - clip.source_range
  - clip.assemble
  - visual.reframe.static
  forbidden_first:
    - visual.motion.push_in
    - visual.motion.pan
    - resolvefx
    - fusion_motion

verdicts:
  pass: PASS
  warning: PACING_WARNING
  repair_candidate: PACING_REPAIR_CANDIDATE
  exempt: PACING_EXEMPT
