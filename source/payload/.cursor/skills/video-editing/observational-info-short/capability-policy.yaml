schema_version: 1
style_id: observational-info-short

# L2 → L1 bridge. Logical Capability IDs only — no Runtime names.

visual:
  asset_selection:
    required:
      - visual.select_asset
    criticality: REQUIRED

  static_framing:
    required:
      - visual.reframe.static
    criticality: REQUIRED

  motivated_motion:
    preferred:
      - visual.motion.push_in
      - visual.motion.pan
    fallback:
      visual.motion.push_in:
        - visual.reframe.static
      visual.motion.pan:
        - visual.reframe.static
    forbidden:
      - visual.motion.aggressive_zoom
    criticality: PREFERRED

  speed_normalization:
    preferred:
      - visual.motion.speed_change
    criticality: PREFERRED

  trim:
    preferred:
      - visual.trim
    criticality: PREFERRED

edit:
  hard_cut:
    required:
      - edit.cut
    criticality: REQUIRED

  dissolve_transition:
    preferred:
      - edit.transition.cross_dissolve
    fallback:
      edit.transition.cross_dissolve:
        - edit.transition.basic
    criticality: PREFERRED

subtitle:
  semantic_cues:
    required:
      - subtitle.segment.semantic
      - subtitle.render.basic
    criticality: REQUIRED

  pixel_layout:
    preferred:
      - subtitle.layout.pixel_width
    fallback:
      subtitle.layout.pixel_width:
        - subtitle.segment.semantic
    criticality: PREFERRED

  keyword_emphasis:
    optional:
      - subtitle.style.keyword_emphasis
    criticality: OPTIONAL

audio:
  voice:
    required:
      - audio.voice.place
    criticality: REQUIRED

  original_sound:
    preferred:
      - audio.original_sound.preserve
    criticality: PREFERRED

  music_bed:
    optional:
      - audio.music.place
      - audio.music.crossfade
    criticality: OPTIONAL

  music_under_voice:
    preferred:
      - audio.music.duck
    fallback:
      audio.music.duck:
        - audio.music.place
    criticality: PREFERRED

  ambience:
    preferred:
      - audio.ambience.place
    criticality: PREFERRED

color:
  correction:
    preferred:
      - color.primary_balance
      - color.shot_match
    criticality: PREFERRED

  look:
    optional:
      - color.look.apply
    criticality: OPTIONAL

qa:
  deliverable:
    required:
      - qa.final_artifact
      - qa.visual.frame
    criticality: REQUIRED

  subtitle_visual:
    preferred:
      - qa.subtitle.layout
    criticality: PREFERRED
