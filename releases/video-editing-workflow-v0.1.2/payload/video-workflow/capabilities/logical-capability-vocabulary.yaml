# Logical Capability Vocabulary — L1 canonical IDs (Stage 08D.1)
# Canonical status values ONLY:
#   VERIFIED | AVAILABLE_UNVERIFIED | UNKNOWN | FAILED | UNSAFE | DEFERRED
# L2 capability-policy.yaml MUST reference IDs defined here only.

schema_version: 1

canonical_states:
  - VERIFIED
  - AVAILABLE_UNVERIFIED
  - UNKNOWN
  - FAILED
  - UNSAFE
  - DEFERRED

# Resolution state matrix (see capability-resolution-reference.md):
# VERIFIED → SELECTED
# AVAILABLE_UNVERIFIED → CAPABILITY_VALIDATION_REQUIRED (not direct SELECTED in Production)
# UNKNOWN / FAILED / DEFERRED → unavailable
# UNSAFE → prohibited / never select

vocabulary:

  visual.select_asset:
    status: VERIFIED
    l1_aliases: [media.inspect, media.import]
    notes: Asset selection from pool / input scan

  visual.trim:
    status: AVAILABLE_UNVERIFIED
    l1_aliases: [clip.trim, clip.source_range]
    notes: Timeline or source extent trim — limited read-back evidence

  visual.reframe.static:
    status: VERIFIED
    l1_aliases: [clip.scale, clip.position]
    notes: Static fill-frame reposition (not animated camera move)

  visual.reframe.dynamic:
    status: AVAILABLE_UNVERIFIED
    l1_aliases: [clip.scale, clip.position]
    notes: Animated reframing — CAPABILITY_VALIDATION_REQUIRED

  visual.motion.push_in:
    status: AVAILABLE_UNVERIFIED
    l1_aliases: [clip.scale]
    notes: Motivated push-in; no dedicated animated push API verified

  visual.motion.pan:
    status: AVAILABLE_UNVERIFIED
    l1_aliases: [clip.position]
    notes: Animated pan not verified; clip.position evidence is static reframe only

  visual.motion.speed_change:
    status: VERIFIED
    l1_aliases: [clip.speed]
    notes: Speed normalization / retime

  visual.motion.aggressive_zoom:
    status: FAILED
    l1_aliases: []
    notes: Editorial anti-pattern — Style forbidden list only; never select

  edit.cut:
    status: VERIFIED
    l1_aliases: [clip.assemble]
    notes: Hard cut assembly

  edit.transition.basic:
    status: VERIFIED
    l1_aliases: [clip.assemble]
    notes: Hard / action cut (no effect)

  edit.transition.cross_dissolve:
    status: VERIFIED
    l1_aliases: [transition.apply]
    notes: Dissolve via native_drt_transition route

  subtitle.generate:
    status: VERIFIED
    l1_aliases: [transcription.generate, transcription.read]
    notes: Transcript / cue generation

  subtitle.segment.semantic:
    status: VERIFIED
    l1_aliases: [subtitle.create, subtitle.import]
    notes: Semantic cue placement — does NOT guarantee pixel-width layout

  subtitle.layout.pixel_width:
    status: AVAILABLE_UNVERIFIED
    l1_aliases: [subtitle.safe_text_width, subtitle.line_break_control]
    notes: Deterministic preflight foundation exists (subtitle-layout-preflight.ps1); Resolve renderer parity not Runtime-validated (08E-A)

  subtitle.render.basic:
    status: VERIFIED
    l1_aliases: [subtitle.create]
    notes: Burn-in / timeline subtitle placement

  subtitle.render.readability_stroke:
    status: VERIFIED
    l1_aliases: [subtitle.visual_style]
    notes: "Route A: gold standard Subtitle Track 1 FieldsBlob capture/inject + burn-in deliver visual QA (Repair Step 5). Profile: native-drt-subtitle-readability-profile.yaml"

  subtitle.style.basic:
    status: UNKNOWN
    l1_aliases: [subtitle.visual_style]
    notes: Font/outline API not validated

  subtitle.style.keyword_emphasis:
    status: AVAILABLE_UNVERIFIED
    l1_aliases: [subtitle.keyword_emphasis]
    notes: "Isolated StyledTextCLS SIZE route verified (08E-B B-R1). Production overlay subtitle route not final-validated (08E-FINAL). Logical production capability requires production-shaped integrated probe. NOT VERIFIED color weight tracking variation arbitrary sizes animation kinetic typography."

  audio.voice.place:
    status: VERIFIED
    l1_aliases: [clip.assemble, audio.place]
    notes: Narration / voice on timeline

  audio.original_sound.preserve:
    status: VERIFIED
    l1_aliases: [clip.assemble]
    notes: Editorial preserve of source audio segments

  audio.ambience.place:
    status: VERIFIED
    l1_aliases: [audio.place, audio.import]
    notes: Ambient bed placement

  audio.music.place:
    status: VERIFIED
    l1_aliases: [audio.import, audio.place]
    notes: Music clip placement — not equivalent to ducking

  audio.music.level_under_voice:
    status: VERIFIED
    l1_aliases: [background_music_level_control]
    notes: Music level reduced under voice via verified pre-attenuation route — unchanged Step 4A

  audio.voice_music_mix:
    status: VERIFIED
    l1_aliases: [background_music_level_control, audio.music.level_under_voice]
    notes: Continuous pre-attenuated BGM under voice; not dynamic ducking

  audio.final.measure_loudness:
    status: VERIFIED
    l1_aliases: [final_render.audio_loudness_check]
    notes: Step 4A — audio-loudness-qa.py ebur128 integrated LUFS on rendered artifact

  audio.final.true_peak_qa:
    status: VERIFIED
    l1_aliases: [final_render.audio_loudness_check]
    notes: Step 4A — true peak ceiling check vs narration_short_v1 profile

  audio.final.normalize_or_adjust:
    status: VERIFIED
    l1_aliases: []
    notes: Step 4A-Repair — ffmpeg loudnorm two-pass via final-audio-loudness-repair.py; post-render only; max 1 attempt

  final_audio.auto_repair:
    status: VERIFIED
    l1_aliases: [FINAL_AUDIO_AUTO_REPAIR]
    notes: Step 4A-Repair — QA → repair → re-QA loop via final-artifact-audio-qa-repair.ps1; fail-closed after one attempt

  audio.music.duck:
    status: UNKNOWN
    l1_aliases: [audio.ducking]
    notes: Auto ducking not implemented — unchanged Step 4A

  audio.music.crossfade:
    status: VERIFIED
    l1_aliases: [audio.fade]
    notes: Music fade in/out

  music.library.search:
    status: VERIFIED
    l1_aliases: [music.library.search]
    notes: Step 3B-2 — 4 Adobe Firefly WAV in Astra catalog; filter/rank via shared-asset-music-select.py

  music.library.select:
    status: VERIFIED
    l1_aliases: [music.library.select]
    notes: N02-like requirement ranking validated; missing → MUSIC_ASSET_NOT_AVAILABLE

  music.library.resolve:
    status: VERIFIED
    l1_aliases: [music.library.resolve]
    notes: asset_id → absolute path under shared_asset_root; 4 Firefly tracks resolved in 3B-2

  audio.sfx.place:
    status: AVAILABLE_UNVERIFIED
    l1_aliases: [audio.place]
    notes: SFX placement — limited validation

  color.primary_balance:
    status: VERIFIED
    l1_aliases: [color.basic]
    notes: Exposure / WB / primary correction

  color.shot_match:
    status: AVAILABLE_UNVERIFIED
    l1_aliases: [color.basic]
    notes: Inter-shot match — partial via CDL only

  color.look.apply:
    status: VERIFIED
    l1_aliases: [color.basic]
    notes: Creative look via CDL / grade

  graphics.title.basic:
    status: AVAILABLE_UNVERIFIED
    l1_aliases: [effects.fusion]
    notes: Title cards — Fusion path unverified end-to-end

  graphics.text.motion:
    status: UNKNOWN
    l1_aliases: [effects.fusion]
    notes: CAPABILITY_VALIDATION_REQUIRED

  qa.pacing.heuristic:
    status: VERIFIED
    l1_aliases: []
    notes: Step 4B — pacing-qa.py beat-first shot duration / unchanged-span heuristics

  qa.pacing.repair_candidate:
    status: VERIFIED
    l1_aliases: []
    notes: Step 4B — flags PACING_REPAIR_CANDIDATE with beat/shot/asset traceability

  qa.visual.black_bar_detect:
    status: VERIFIED
    l1_aliases: [final_render.black_bar_check]
    notes: Step 4B — black-bar-qa.py ffmpeg cropdetect multiframe per-edge

  qa.visual.reframe_static_repair:
    status: VERIFIED
    l1_aliases: [visual.reframe.static]
    notes: Step 4B — scale/position suggestion route; fixture-validated

  qa.visual.reframe_repair_loop:
    status: VERIFIED
    l1_aliases: []
    notes: Step 4B — detect → static reframe → re-QA validated on disposable fixtures

  qa.visual.frame:
    status: VERIFIED
    l1_aliases: [final_render.frame_sampling]
    notes: Frame extract — black-bar gate now qa.visual.black_bar_detect

  qa.subtitle.layout:
    status: VERIFIED
    l1_aliases: [final_render.subtitle_visual_qa]
    notes: Subtitle in deliverable

  qa.audio:
    status: VERIFIED
    l1_aliases: [final_render.audio_loudness_check, render.verify]
    notes: Step 4A — integrated LUFS + true peak verdicts via audio-loudness-qa.py

  qa.final_artifact:
    status: VERIFIED
    l1_aliases: [render.verify, final_render.frame_sampling]
    notes: Post-render deliverable QA
